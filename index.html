<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ane Ugarte</title>

<!-- ══════════════════════════════════════════════════════════════════
     PAGINA DE ESPERA, 21-09-2026.

     Lo pidio Ane: «pon que la web esta en proceso (fondo blanco y muy
     minimalista). Porque no quiero que ahora este nada publicado».

     LA WEB NO SE HA BORRADO. Esta entera en el historial de este mismo
     repositorio, en el commit anterior a este. Para devolverla:

         git checkout <ese commit> -- index.html && git commit && git push

     El resto de los archivos —las fotos, las mascaras, el favicon, el
     CNAME, robots.txt y sitemap.xml— siguen donde estaban y no se han
     tocado: nadie tiene sus direcciones y quitarlos solo complicaria la
     vuelta.

     EL `noindex` ES A PROPOSITO y es lo que de verdad cumple lo que ella
     pidio. Sin el, el buscador puede quedarse ESTA pagina como resultado
     de «Ane Ugarte» — que es justo lo contrario de no tener nada
     publicado. Se quita borrando una linea, la del `<meta name="robots">`,
     cuando vuelva la web. Ojo: `robots.txt` NO se toca, porque si se
     bloquea el rastreo el buscador no llega a leer este `noindex` y se
     queda con lo que ya tenia.

     EL ROTULO ES EL SUYO, no uno inventado para esta pagina: la misma
     construccion que el logotipo de la portada —Archivo, dos lineas
     apiladas, `wdth` 74 con `wght` 800 arriba y 600 abajo, el mismo
     entreletrado de .145em en la segunda y el mismo interlineado de .84—.
     Lo unico que cambia es que aqui esta centrado y no en una esquina.
     ══════════════════════════════════════════════════════════════════ -->

<meta name="robots" content="noindex">
<link rel="icon" href="favicon.ico?v=6" sizes="any">
<link rel="icon" href="icon.svg?v=6" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=6">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..900&display=swap">

<style>
  :root{
    color-scheme:light;                 /* blanco tambien en tema oscuro */
    --ink:#141416;
    --display:"Archivo","Helvetica Neue",Arial,sans-serif;
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    padding-block:calc(env(safe-area-inset-top,0px) + 24px)
                 calc(env(safe-area-inset-bottom,0px) + 24px);
    padding-inline:24px;
    background:#FFFFFF;
    color:var(--ink);
    font-family:var(--display);
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    gap:clamp(22px,4vh,34px);
    text-align:center;
  }
  .wm{
    line-height:.84;
    text-transform:uppercase;
    font-size:clamp(17px,1.4vw,21px);
  }
  .wm__a{ display:block; font-size:2.05em; font-variation-settings:"wdth" 74,"wght" 800; }
  .wm__b{ display:block; font-variation-settings:"wdth" 74,"wght" 600; letter-spacing:.145em; }
  .nota{
    margin:0;
    font-size:clamp(11px,1vw,12px);
    font-variation-settings:"wdth" 88,"wght" 400;
    letter-spacing:.16em;
    text-transform:uppercase;
    color:#6E6E6C;
  }
</style>
</head>
<body>
  <p class="wm"><span class="wm__a">Ane</span><span class="wm__b">Ugarte</span></p>
  <p class="nota">Site in progress</p>
</body>
</html>
