<!-- ══════════════════════════════════════════════════════════════════
     PAGINA DE ESPERA, 21-09-2026.

     Lo pidio Ane: «pon que la web esta en proceso (fondo blanco y muy
     minimalista). Porque no quiero que ahora este nada publicado», y
     luego, sobre una primera version que llevaba tambien el rotulo:
     «PON SOLAMENTE SITE IN PROGRESS Y YA».

     Asi que en la pagina hay UNA linea y nada mas. Se fue con el rotulo
     todo su aparato: la pareja de `<span>`, el interlineado de .84 y el
     entreletrado de la segunda linea. Si alguien vuelve a meter algo
     aqui —un correo, un «vuelve pronto», un enlace—, esta dejando de
     cumplir lo que ella pidio.

     EL TITULO TAMBIEN DICE ESO Y NO SU NOMBRE. La pestaña del navegador
     y cualquier vista previa de un enlace son texto publicado igual que
     el cuerpo; dejar ahi «Ane Ugarte» seria publicar justo lo que no
     quiere. El favicon SI se queda: no es contenido de la pagina, y sin
     el la pestaña sale con el icono roto, que parece una averia en vez
     de una espera.

     LA WEB NO SE HA BORRADO. Esta entera en el historial de este mismo
     repositorio, en el commit 535bd04. Para devolverla:

         git checkout 535bd04 -- index.html && git commit && git push

     El resto de los archivos —las fotos, las mascaras, el favicon, el
     CNAME, robots.txt y sitemap.xml— siguen donde estaban y no se han
     tocado: nadie tiene sus direcciones y quitarlos solo complicaria la
     vuelta.

     EL `noindex` ES A PROPOSITO y es lo que de verdad cumple lo que ella
     pidio. Sin el, el buscador puede quedarse ESTA pagina como resultado
     de «Ane Ugarte» — que es justo lo contrario de no tener nada
     publicado. Se quita borrando una linea, la del `<meta name="robots">`,
     cuando vuelva la web. Ojo: `robots.txt` NO se toca, porque si se
     bloquea el rastreo el buscador no llega a leer este `noindex` y se
     queda con lo que ya tenia.
     ══════════════════════════════════════════════════════════════════ -->
